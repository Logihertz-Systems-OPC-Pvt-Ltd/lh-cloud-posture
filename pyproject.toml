[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-cloud-posture"
version = "0.1.0"
description = "Audits Terraform HCL/JSON plans, Kubernetes workload manifests, and AWS CloudFormation templates for public storage buckets, wildcard IAM privileges, unencrypted volumes, and exposed security groups."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "cspm",
    "terraform-security",
    "kubernetes-security",
    "cloudformation",
    "iac-scanner",
    "sarif",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-cloud-posture"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-cloud-posture"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-cloud-posture#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-cloud-posture/issues"

[project.scripts]
lh-cloud = "lh_cloud_posture.cli:app"
lh-cloud-posture = "lh_cloud_posture.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_cloud_posture"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

